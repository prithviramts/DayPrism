<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Offline · Daywise</title>
    <link rel="icon" href="/icons/favicon-32.png">
    <!-- Shown by the service worker when you're offline and this page was never opened before.
         Styles are inline so it works even if nothing else is cached. -->
    <style>
        :root { --bg: #f9f9f7; --text: #0b0b0b; --muted: #52514e; --accent: #2a78d6; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0d0d0d; --text: #fff; --muted: #c3c2b7; --accent: #3987e5; } }
        body {
            margin: 0; min-height: 100dvh; display: grid; place-items: center;
            background: var(--bg); color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            padding: 24px; box-sizing: border-box; text-align: center;
        }
        img { width: 72px; height: 72px; }
        h1 { font-size: 1.4rem; margin: 16px 0 8px; }
        p { color: var(--muted); max-width: 26rem; line-height: 1.5; margin: 0 auto 20px; }
        button {
            min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px;
            background: var(--accent); color: #fff; font-size: 1rem; font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>Daywise can't reach its server right now, and this page hasn't been saved for offline use yet. Pages you've opened before still work offline.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
