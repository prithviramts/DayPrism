<!-- Supabase → Authentication → Emails → "Confirm signup". Subject: Your DayPrism verification code -->
<div style="font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#f4f6fa; padding:32px 16px;">
  <div style="max-width:480px; margin:0 auto; background:#ffffff; border-radius:20px; padding:32px; color:#0f172a;">
    <div style="width:48px; height:48px; border-radius:12px; background:#2a78d6; color:#fff; font-size:26px; font-weight:800; line-height:48px; text-align:center;">L</div>
    <h1 style="font-size:22px; margin:24px 0 8px;">Confirm your email</h1>
    <p style="font-size:15px; line-height:22px; color:#475569; margin:0 0 24px;">
      Enter this code in the DayPrism app to finish creating your account.
    </p>
    <div style="font-size:34px; font-weight:800; letter-spacing:10px; background:#eef1f6; border-radius:14px; padding:18px; text-align:center;">{{ .Token }}</div>
    <p style="font-size:13px; line-height:20px; color:#8a94a6; margin:24px 0 0;">
      The code expires in 1 hour. If you didn't create a DayPrism account, you can ignore this email.
    </p>
  </div>
</div>
